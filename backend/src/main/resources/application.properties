spring.application.name=campconnect-backend
server.port=${SERVER_PORT:8090}

# Use ISO-8601 for dates instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Allow bean definition overriding for integrated modules
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/campconnectdb}

# JWT Configuration
app.jwtSecret=${JWT_SECRET:changeme-dev-only-secret-key-minimum-length-for-hmac-sha256}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# AI Configuration
openai.api.key=${OPENAI_API_KEY:}

# Stripe Configuration
stripe.api.key=${STRIPE_SECRET_KEY:}

# OpenRouteService Mapping
ors.api.key=${ORS_API_KEY:}

# ML Demand Prediction (Flask API)
ml.api.url=${ML_DEMAND_URL:http://localhost:5000}

# ML Gear Recommendation (Flask API)
ml.gear.recommendation.url=${ML_GEAR_URL:http://localhost:5001}

# Default Delivery Provider (used for auto-assignment fallback and data seeding)
delivery.default.provider.email=${DELIVERY_PROVIDER_EMAIL:delivery@mail.com}
