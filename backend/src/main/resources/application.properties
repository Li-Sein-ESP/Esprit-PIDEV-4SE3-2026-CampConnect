spring.application.name=campconnect-backend
server.port=${SERVER_PORT:8090}

# Use ISO-8601 for dates instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Allow bean definition overriding for integrated modules
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/campconnectdb

# JWT Configuration (Change this in production)
app.jwtSecret=CampConnectSecretKeyForJwtTokenGenerationWhichShouldBeLongEnoughToMeetRequirements
app.jwtExpirationMs=86400000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# AI Configuration
openai.api.key=sk-your-real-openai-api-key-here

# Groq API Configuration (set GROQ_API_KEY environment variable at runtime)
groq.api.key=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

# ML Microservice
ml.forecast.url=http://localhost:5000

# H2 / JPA Configuration (for Audit & Analytics)
spring.datasource.url=jdbc:h2:mem:analyticsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Prevent JPA from trying to manage MongoDB entities
spring.data.jpa.repositories.bootstrap-mode=default
