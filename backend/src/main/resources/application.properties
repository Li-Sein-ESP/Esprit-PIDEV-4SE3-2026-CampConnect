spring.application.name=campconnect-backend
server.port=${SERVER_PORT:8089}

# Use ISO-8601 for dates instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Allow bean definition overriding for integrated modules
spring.main.allow-bean-definition-overriding=true


# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/CampconnectDB

# JWT Configuration (Change this in production)
app.jwtSecret=CampConnectSecretKeyForJwtTokenGenerationWhichShouldBeLongEnoughToMeetRequirements
app.jwtExpirationMs=86400000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# WeatherAPI.com Configuration
weather.api.key=03dc367fe4004c7795f02836261904
weather.api.url=http://api.weatherapi.com/v1

# OpenAI Configuration
openai.api.key=AIzaSyAX7ZIm9h4zifWOcceiYOnQXT4eHX7J02g

# Moderation AI Configuration (chemins relatifs au démarrage depuis le dossier backend — idem que mvn spring-boot:run)
# Après setup_ml.bat : venv dans backend/ml/.venv — surcharger si besoin : MODERATION_PYTHON_COMMAND
moderation.python.command=ml/.venv/Scripts/python.exe
moderation.python.script=ml/moderation/predict_moderation.py
moderation.model.dir=ml/models

# Flux publication : true = aucun post sur le feed tant que l'admin n'a pas approuvé (recommandé)
moderation.workflow.require-admin-approval=true

# Modération des commentaires : liste CSV (vide = mots par défaut dans CommentProfanitySupport)
# moderation.comment.banned-keywords=merde,idiot,...
# Vérification planifiée des commentaires déjà publiés (ms) — défaut 1 min
moderation.comment.cleanup-interval-ms=60000

# Micro-service Python (FastAPI) — itinéraire / budget
campconnect.ai-service.base-url=http://localhost:5050

# Mail (emails bannissement / réhabilitation) — mettre app.mail.enabled=true + identifiants valides
app.mail.enabled=false
app.mail.from=CampConnect <campconnect.noreply@gmail.com>

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=campconnect.test@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
