spring.application.name=campconnect-backend
server.port=${SERVER_PORT:8090}
# Augmente la taille maximale des headers HTTP pour les JWT tokens (propriété correcte pour Spring Boot 3.x)
server.tomcat.max-http-request-header-size=131072

# Use ISO-8601 for dates instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Allow bean definition overriding for integrated modules
spring.main.allow-bean-definition-overriding=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/CampconnectDB

# JWT Configuration (Change this in production)
app.jwtSecret=CampConnectSecretKeyForJwtTokenGenerationWhichShouldBeLongEnoughToMeetRequirements
app.jwtExpirationMs=86400000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# Upload directory (absolute path for reliable file resolution in moderation)
app.upload.dir=uploads

# AI Configuration
openai.api.key=${OPENAI_API_KEY:}

# AI Moderation ML Configuration
moderation.python.command=C:/Users/marye/anaconda3/python.exe
moderation.python.script=${MODERATION_PYTHON_SCRIPT:ml/moderation/predict_moderation.py}
moderation.data.dir=${MODERATION_DATA_DIR:C:/Users/marye/Downloads/datasets_clean}
moderation.model.dir=${MODERATION_MODEL_DIR:ml/models}
moderation.threshold.review=${MODERATION_REVIEW_THRESHOLD:0.10}
moderation.threshold.block=${MODERATION_BLOCK_THRESHOLD:0.60}
moderation.text.keyword.weight=${MODERATION_TEXT_WEIGHT:0.40}
moderation.user.auto-ban.block-count=${MODERATION_AUTO_BAN_BLOCK_COUNT:3}

# CampGuard CSV + KPI + scheduler configuration
campguard.files.predictions-path=${CAMPGUARD_PREDICTIONS_PATH:backend/campguard_predictions.csv}
campguard.files.queue-path=${CAMPGUARD_QUEUE_PATH:backend/campaign_queue_antispam.csv}
campguard.files.history-path=${CAMPGUARD_HISTORY_PATH:backend/campaign_history.csv}
campguard.logic.antispam-days=${CAMPGUARD_ANTISPAM_DAYS:7}
campguard.kpi.recall=${CAMPGUARD_KPI_RECALL:0.8182}
campguard.kpi.precision=${CAMPGUARD_KPI_PRECISION:0.3498}
campguard.kpi.reengagement-rate=${CAMPGUARD_KPI_REENGAGEMENT_RATE:0.0}
campguard.kpi.churn-before=${CAMPGUARD_KPI_CHURN_BEFORE:0.2037}
campguard.kpi.churn-after=${CAMPGUARD_KPI_CHURN_AFTER:0.0}
campguard.scheduler.enabled=${CAMPGUARD_SCHEDULER_ENABLED:false}
campguard.scheduler.cron=${CAMPGUARD_SCHEDULER_CRON:0 0 2 * * ?}

