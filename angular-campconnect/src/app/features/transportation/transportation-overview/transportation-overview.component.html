<div class="min-h-screen bg-[var(--color-background)] py-12">
  <div class="container max-w-6xl">
    <h2 class="mb-8">Transportation Options</h2>

    <app-card variant="elevated" class="mb-8">
      <app-card-content class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <input [(ngModel)]="origin" placeholder="From"
            class="px-4 py-2 rounded-lg border-2 border-[var(--color-border-light)]" />
          <input [(ngModel)]="destination" placeholder="To"
            class="px-4 py-2 rounded-lg border-2 border-[var(--color-border-light)]" />
          <app-button (click)="searchRoutes()" [fullWidth]="true">
            <lucide-icon [img]="Search" class="w-5 h-5 mr-2"></lucide-icon>
            Search Routes
          </app-button>
        </div>
      </app-card-content>
    </app-card>

    @if (routes().length > 0) {
    <div class="space-y-4">
      @for (route of routes(); track route.id) {
      <app-card variant="elevated" class="hover:shadow-lg transition-shadow">
        <app-card-content class="p-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <lucide-icon [img]="getIcon(route.mode)" class="w-8 h-8 text-[var(--color-primary-600)]"></lucide-icon>
              <div>
                <div class="font-medium capitalize">{{ route.mode }}</div>
                <div class="text-sm text-[var(--color-text-secondary)]">{{ route.distance }} miles • {{ route.duration
                  }} min</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-bold text-[var(--color-primary-600)]">\${{ route.price }}</div>
              <app-button size="sm" class="mt-2">Select</app-button>
            </div>
          </div>
        </app-card-content>
      </app-card>
      }
    </div>
    }
  </div>
</div>
