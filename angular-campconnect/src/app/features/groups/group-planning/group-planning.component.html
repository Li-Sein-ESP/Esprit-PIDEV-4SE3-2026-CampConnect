<div class="planning-container h-full flex flex-col md:flex-row gap-6">

    <!-- Center Column: To Do List -->
    <div
        class="tasks-section w-full bg-[var(--color-surface)] rounded-2xl border border-[var(--color-border-light)] p-5 shadow-sm flex flex-col min-h-full">

        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="font-bold text-2xl text-[var(--color-text-primary)] flex items-center gap-2">
                    <lucide-icon [img]="CheckCircle" size="24" class="text-emerald-500"></lucide-icon>
                    To-Do List du Groupe
                </h2>
                <p class="text-sm text-[var(--color-text-secondary)] mt-1">Organisez votre voyage ensemble.</p>
            </div>

            <button *ngIf="!showNewTaskForm" (click)="showNewTaskForm = true"
                class="flex items-center gap-2 px-4 py-2 bg-emerald-500 text-white hover:bg-emerald-600 rounded-xl transition cursor-pointer font-medium shadow-sm">
                <lucide-icon [img]="Plus" size="18"></lucide-icon>
                Ajouter
            </button>
        </div>

        <!-- Add Task Form -->
        <div *ngIf="showNewTaskForm"
            class="mb-6 bg-white p-4 rounded-xl border border-emerald-200 shadow-sm transition-all">
            <input type="text" [(ngModel)]="newTaskTitle" placeholder="Qu'est-ce qu'il y a à faire ? (Ex: Acheter le bois)"
                (keydown.enter)="addTask()" autofocus
                class="w-full text-base bg-transparent border-b-2 border-gray-100 pb-2 mb-4 focus:outline-none focus:border-emerald-500 text-gray-800 transition-colors">
            <div class="flex justify-end gap-3">
                <button (click)="showNewTaskForm = false"
                    class="text-sm font-medium text-gray-400 hover:text-red-500 px-3 py-1.5 transition-colors cursor-pointer">Annuler</button>
                <button (click)="addTask()" [disabled]="!newTaskTitle.trim()"
                    class="text-sm font-semibold bg-emerald-500 text-white px-5 py-2 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-600 transition-colors cursor-pointer">Ajouter la Tâche</button>
            </div>
        </div>

        <div *ngIf="loadingTasks && pendingTasks.length === 0 && completedTasks.length === 0" class="flex-1 flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500"></div>
        </div>

        <!-- Checklist -->
        <div class="flex-1 space-y-8" *ngIf="!loadingTasks">

            <!-- Pendantes -->
            <div>
                <h3 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-4 flex items-center">
                    À Faire <span class="bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full ml-3 text-xs">{{pendingTasks.length}}</span>
                </h3>
                
                <div class="space-y-3">
                    <div *ngIf="pendingTasks.length === 0" class="text-center py-6 border-2 border-dashed border-gray-200 rounded-xl text-gray-400 text-sm">
                        Tout est à jour ! 🎉
                    </div>

                    <div *ngFor="let task of pendingTasks"
                        class="group flex items-center justify-between bg-white p-4 rounded-xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.02)] hover:shadow-md transition-all cursor-pointer"
                        (click)="toggleTask(task)">
                        <div class="flex items-center gap-4">
                            <button class="text-gray-300 group-hover:text-emerald-500 transition-colors focus:outline-none shrink-0 cursor-pointer">
                                <lucide-icon [img]="Circle" size="24"></lucide-icon>
                            </button>
                            <span class="text-base font-medium text-gray-800">{{task.title}}</span>
                        </div>
                        <button (click)="deleteTask(task); $event.stopPropagation()"
                            class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2 focus:outline-none cursor-pointer">
                            <lucide-icon [img]="Trash2" size="18"></lucide-icon>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Terminées -->
            <div *ngIf="completedTasks.length > 0">
                <h3 class="text-sm font-bold text-emerald-600 uppercase tracking-widest mb-4 flex items-center">
                    Terminées <span class="bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-full ml-3 text-xs">{{completedTasks.length}}</span>
                </h3>
                
                <div class="space-y-3">
                    <div *ngFor="let task of completedTasks"
                        class="group flex items-center justify-between bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 shadow-sm transition-all opacity-75 hover:opacity-100 cursor-pointer"
                        (click)="toggleTask(task)">
                        <div class="flex items-center gap-4">
                            <button class="text-emerald-500 transition-colors focus:outline-none shrink-0 cursor-pointer">
                                <lucide-icon [img]="CheckCircle" size="24"></lucide-icon>
                            </button>
                            <span class="text-base font-medium text-gray-500 line-through">{{task.title}}</span>
                        </div>
                        <button (click)="deleteTask(task); $event.stopPropagation()"
                            class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all p-2 focus:outline-none cursor-pointer">
                            <lucide-icon [img]="Trash2" size="18"></lucide-icon>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
