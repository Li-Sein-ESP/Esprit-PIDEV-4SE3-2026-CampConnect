<header
    class="sticky top-0 z-20 bg-white border-b border-stone-200 px-6 lg:px-8 py-4 flex items-center justify-between min-h-[72px]">
    <div class="flex items-center">
        <h2 class="text-xl font-bold text-stone-800 m-0">Provider Portal</h2>
    </div>
    <div class="flex items-center space-x-3 lg:space-x-4">
        <a routerLink="/"
            class="text-sm font-medium text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-3 lg:px-4 py-2 rounded-lg transition-colors no-underline flex items-center gap-2">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="hidden lg:inline">Marketplace</span>
        </a>
        <button (click)="logout()"
            class="text-sm font-medium text-stone-600 hover:text-red-600 bg-stone-100 hover:bg-red-50 px-3 lg:px-4 py-2 rounded-lg transition-colors border-none cursor-pointer flex items-center gap-2">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="hidden lg:inline">Logout</span>
        </button>
    </div>
</header>
