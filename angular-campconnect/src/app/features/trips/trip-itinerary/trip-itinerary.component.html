<div class="min-h-screen bg-[var(--color-background)] py-12">
  <div class="container max-w-4xl">
    <h2 class="mb-8">Trip Itinerary</h2>

    <div class="space-y-6">
      @for (day of mockDays; track day.dayNumber) {
      <app-card variant="elevated">
        <app-card-header>
          <app-card-title>Day {{ day.dayNumber }} - {{ day.date }}</app-card-title>
        </app-card-header>
        <app-card-content>
          <div class="space-y-4">
            @for (activity of day.activities; track activity.id) {
            <div class="flex gap-4 p-4 bg-[var(--color-background)] rounded-lg">
              <div class="flex flex-col items-center">
                <div class="w-12 h-12 bg-[var(--color-primary-100)] rounded-full flex items-center justify-center">
                  <lucide-icon [img]="Clock" class="w-6 h-6 text-[var(--color-primary-600)]"></lucide-icon>
                </div>
                <span class="text-sm font-medium mt-2">{{ activity.time }}</span>
              </div>
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-2">
                  <h5>{{ activity.title }}</h5>
                  <app-badge variant="outline">{{ activity.type }}</app-badge>
                </div>
                <p class="text-sm text-[var(--color-text-secondary)] mb-2">{{ activity.description }}</p>
                <div class="flex items-center gap-2 text-sm text-[var(--color-text-tertiary)]">
                  <lucide-icon [img]="MapPin" class="w-4 h-4"></lucide-icon>
                  <span>{{ activity.location }}</span>
                </div>
              </div>
            </div>
            }
          </div>
        </app-card-content>
      </app-card>
      }
    </div>
  </div>
</div>
