<div class="rounded-xl border border-stone-200 bg-white p-3">
    <p class="text-xs font-semibold text-stone-500 mb-2">Available Warehouses</p>

    <div *ngIf="loading" class="text-xs text-stone-500">Loading warehouses...</div>

    <div *ngIf="!loading && warehouses.length === 0" class="text-xs text-rose-600">
        No warehouse with enough stock near your location.
    </div>

    <div *ngIf="!loading && warehouses.length > 0" class="space-y-2">
        <button
            type="button"
            *ngFor="let w of warehouses"
            (click)="select(w.warehouseId)"
            class="w-full text-left px-3 py-2 rounded-lg border transition"
            [class.border-emerald-500]="selectedId === w.warehouseId"
            [class.bg-emerald-50]="selectedId === w.warehouseId"
            [class.border-stone-200]="selectedId !== w.warehouseId"
        >
            <div class="text-sm font-medium text-stone-800">{{ w.warehouseName || w.warehouseId }}</div>
            <div class="text-xs text-stone-500">Stock: {{ w.quantity }}</div>
        </button>
    </div>
</div>
