<div class="relative bg-[#e5e3df] rounded-lg overflow-hidden" [style.height]="height" [ngClass]="className">
    <!-- Map Background with Terrain Texture -->
    <div class="absolute inset-0">
        <svg class="w-full h-full" style="opacity: 0.15">
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b7355" stroke-width="0.5" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>

        <!-- Terrain Features -->
        <div class="absolute inset-0 opacity-20">
            <div
                class="absolute top-1/4 left-1/4 w-32 h-32 bg-gradient-radial from-[#8b7355] to-transparent rounded-full blur-xl">
            </div>
            <div
                class="absolute top-1/3 right-1/3 w-40 h-40 bg-gradient-radial from-[#6b5d4f] to-transparent rounded-full blur-xl">
            </div>
            <div
                class="absolute bottom-1/3 left-1/2 w-48 h-48 bg-gradient-radial from-[#4a5f3a] to-transparent rounded-full blur-2xl">
            </div>
            <div
                class="absolute top-1/2 right-1/4 w-36 h-24 bg-gradient-radial from-[#6b9ac4] to-transparent rounded-full blur-xl opacity-60">
            </div>
        </div>
    </div>

    <!-- Roads/Trails - simplified -->
    <svg class="absolute inset-0 pointer-events-none" style="opacity: 0.3">
        <path d="M 0 50% Q 25% 40%, 50% 50% T 100% 45%" fill="none" stroke="#8b7355" stroke-width="2"
            stroke-dasharray="5,5" />
        <path d="M 30% 0 Q 40% 30%, 50% 50% T 60% 100%" fill="none" stroke="#8b7355" stroke-width="2"
            stroke-dasharray="5,5" />
    </svg>

    <!-- Campsite Markers -->
    <ng-container *ngFor="let marker of markers">
        <button (click)="markerClick.emit(marker)"
            class="absolute transform -translate-x-1/2 -translate-y-full transition-all duration-200 z-10 group"
            [style.left]="latLngToPixel(marker.lat, marker.lng).x"
            [style.top]="latLngToPixel(marker.lat, marker.lng).y">
            <!-- Marker Pin -->
            <div class="relative transition-all duration-200"
                [class.scale-125]="hoveredMarkerId === marker.id || selectedMarkerId === marker.id"
                [class.scale-100]="hoveredMarkerId !== marker.id && selectedMarkerId !== marker.id">
                <lucide-icon [name]="MapPin" class="w-8 h-8 transition-all"
                    [class.text-[var(--color-primary-600)]]="selectedMarkerId === marker.id || (hoveredMarkerId !== marker.id && selectedMarkerId !== marker.id)"
                    [class.fill-[var(--color-primary-600)]]="selectedMarkerId === marker.id"
                    [class.text-[var(--color-accent-500)]]="hoveredMarkerId === marker.id"
                    [class.fill-[var(--color-accent-500)]]="hoveredMarkerId === marker.id"
                    [class.fill-white]="selectedMarkerId !== marker.id && hoveredMarkerId !== marker.id"
                    style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3))"></lucide-icon>

                <!-- Pulse effect for selected -->
                <div *ngIf="selectedMarkerId === marker.id" class="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-8">
                    <div class="absolute inset-0 bg-[var(--color-primary-600)] rounded-full opacity-30 animate-ping">
                    </div>
                </div>
            </div>

            <!-- Marker Label - shows on hover -->
            <div *ngIf="hoveredMarkerId === marker.id || selectedMarkerId === marker.id"
                class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-full mb-2 whitespace-nowrap">
                <div
                    class="bg-white px-3 py-1.5 rounded-lg shadow-lg border border-[var(--color-border-light)] text-sm font-medium">
                    {{ marker.title }}
                </div>
            </div>
        </button>
    </ng-container>

    <!-- Map Controls -->
    <div class="absolute top-4 right-4 flex flex-col gap-2 z-20">
        <button (click)="onZoomIn()"
            class="w-10 h-10 bg-white rounded-lg shadow-lg border border-[var(--color-border-light)] flex items-center justify-center hover:bg-[var(--color-neutral-100)] transition-colors"
            title="Zoom in">
            <lucide-icon [name]="ZoomIn" class="w-5 h-5 text-[var(--color-text-secondary)]"></lucide-icon>
        </button>
        <button (click)="onZoomOut()"
            class="w-10 h-10 bg-white rounded-lg shadow-lg border border-[var(--color-border-light)] flex items-center justify-center hover:bg-[var(--color-neutral-100)] transition-colors"
            title="Zoom out">
            <lucide-icon [name]="ZoomOut" class="w-5 h-5 text-[var(--color-text-secondary)]"></lucide-icon>
        </button>
        <button (click)="onCenter()"
            class="w-10 h-10 bg-white rounded-lg shadow-lg border border-[var(--color-border-light)] flex items-center justify-center hover:bg-[var(--color-neutral-100)] transition-colors"
            title="Center map">
            <lucide-icon [name]="Navigation" class="w-5 h-5 text-[var(--color-text-secondary)]"></lucide-icon>
        </button>
        <button (click)="isFullscreen = !isFullscreen"
            class="w-10 h-10 bg-white rounded-lg shadow-lg border border-[var(--color-border-light)] flex items-center justify-center hover:bg-[var(--color-neutral-100)] transition-colors"
            title="Fullscreen">
            <lucide-icon [name]="Maximize2" class="w-5 h-5 text-[var(--color-text-secondary)]"></lucide-icon>
        </button>
    </div>

    <!-- Scale indicator -->
    <div
        class="absolute bottom-4 left-4 bg-white px-3 py-2 rounded-lg shadow-lg border border-[var(--color-border-light)] text-xs text-[var(--color-text-secondary)]">
        <div class="flex items-center gap-2">
            <div class="w-16 h-0.5 bg-[var(--color-text-secondary)]"></div>
            <span>10 mi</span>
        </div>
    </div>

    <!-- Attribution -->
    <div class="absolute bottom-4 right-4 text-xs text-[var(--color-text-tertiary)] bg-white/80 px-2 py-1 rounded">
        Map data © CampConnect
    </div>
</div>
