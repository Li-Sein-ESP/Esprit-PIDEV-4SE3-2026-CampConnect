<div class="relative w-full h-[350px] flex justify-center items-center">
    <svg [attr.viewBox]="'0 0 ' + viewBoxSize + ' ' + viewBoxSize" class="w-full h-full max-w-[350px] max-h-[350px]">

        <!-- Background Rings (Scale grid) -->
        <!-- Level 10 (Outer) -->
        <polygon [attr.points]="getGridRingPoints(10)" fill="none" class="stroke-gray-700/30" stroke-width="1">
        </polygon>
        <!-- Level 8 -->
        <polygon [attr.points]="getGridRingPoints(8)" fill="none" class="stroke-gray-700/30" stroke-width="1"></polygon>
        <!-- Level 6 -->
        <polygon [attr.points]="getGridRingPoints(6)" fill="none" class="stroke-gray-700/30" stroke-width="1"></polygon>
        <!-- Level 4 -->
        <polygon [attr.points]="getGridRingPoints(4)" fill="none" class="stroke-gray-700/30" stroke-width="1"></polygon>
        <!-- Level 2 (Inner) -->
        <polygon [attr.points]="getGridRingPoints(2)" fill="none" class="stroke-gray-700/30" stroke-width="1"></polygon>

        <!-- Axes Lines (Spokes) -->
        <g *ngFor="let label of labels; let i = index">
            <line [attr.x1]="center" [attr.y1]="center" [attr.x2]="getCoordinatesForValue(10, i, 5).x"
                [attr.y2]="getCoordinatesForValue(10, i, 5).y" class="stroke-gray-700/50" stroke-width="1">
            </line>
        </g>

        <!-- Match/Companion Polygon (Underneath) -->
        <polygon *ngIf="matchPoints" [attr.points]="matchPoints"
            class="fill-[var(--color-neutral-300)] stroke-[var(--color-neutral-400)] transition-all duration-700"
            fill-opacity="0.2" stroke-width="2">
        </polygon>

        <!-- User Polygon (On Top) -->
        <polygon *ngIf="userPoints" [attr.points]="userPoints"
            class="fill-[var(--color-primary-500)] stroke-[var(--color-primary-400)] transition-all duration-700 hover:fill-[var(--color-primary-400)]"
            fill-opacity="0.8" stroke-width="3">
        </polygon>

        <!-- Labels -->
        <g *ngFor="let label of labels; let i = index">
            <text [attr.x]="getLabelCoordinates(i).x" [attr.y]="getLabelCoordinates(i).y" text-anchor="middle"
                alignment-baseline="middle" class="fill-gray-300 text-[10px] font-semibold tracking-wider uppercase">
                {{ label }}
            </text>
        </g>
    </svg>

    <!-- Legend -->
    <div class="absolute bottom-[-10px] w-full flex justify-center gap-6">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-[var(--color-primary-500)]"></div>
            <span class="text-xs text-gray-400">You</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-[var(--color-neutral-400)]"></div>
            <span class="text-xs text-gray-400">Match</span>
        </div>
    </div>
</div>
