<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm animate-fade-in" (click)="onBackdropClick()"></div>

    <!-- Modal -->
    <div class="relative w-full bg-white rounded-2xl shadow-2xl animate-scale-in" [ngClass]="sizeClass"
        (click)="$event.stopPropagation()">
        <!-- Header -->
        <div *ngIf="title || showCloseButton"
            class="flex items-center justify-between p-6 border-b border-[var(--color-border-light)]">
            <h2 *ngIf="title" class="text-2xl font-semibold text-[var(--color-text-primary)]">
                {{ title }}
            </h2>
            <button *ngIf="showCloseButton" (click)="close.emit()"
                class="ml-auto p-1 rounded-lg hover:bg-[var(--color-neutral-100)] transition-colors">
                <lucide-icon [name]="X" size="24" class="text-[var(--color-text-secondary)]"></lucide-icon>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6">
            <ng-content></ng-content>
        </div>
    </div>
</div>
