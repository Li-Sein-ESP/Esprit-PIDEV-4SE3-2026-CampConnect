<div [ngClass]="badgeClasses" [attr.data-score]="score" [attr.data-animate]="isAnimating ? '' : null">
    <!-- Tooltip Trigger (Only for Default & Admin) -->
    <button *ngIf="variant !== 'small'" class="trust-badge__info-trigger" aria-label="How is this score calculated?">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
        </svg>
    </button>

    <!-- Tooltip (Only for Default & Admin) -->
    <div *ngIf="variant !== 'small'" class="trust-badge__tooltip">
        <div class="trust-badge__tooltip-title">How Trust Score Works</div>
        <ul class="trust-badge__tooltip-list">
            <li>Profile completeness</li>
            <li>Verified identity</li>
            <li>Community reviews</li>
            <li>Booking history</li>
            <li>Response rate & time</li>
        </ul>
    </div>

    <!-- Ring Progress -->
    <div class="trust-badge__ring-wrap">
        <svg class="trust-badge__ring-svg" viewBox="0 0 120 120">
            <circle class="trust-badge__ring-track" cx="60" cy="60" r="52"></circle>
            <!-- Dasharray applied via inline style for animation -->
            <circle class="trust-badge__ring-progress" cx="60" cy="60" r="52" [style.stroke-dasharray]="dashArray">
            </circle>
        </svg>
        <div class="trust-badge__ring-center">
            <!-- Only animate the value text if it's default/admin size to match design, CSS handles it via data-animate -->
            <span class="trust-badge__score-value">{{ score }}</span>
            <span class="trust-badge__score-unit" *ngIf="variant === 'default'">/ 100</span>
        </div>
    </div>

    <!-- Level Icon & Label -->
    <div class="trust-badge__level">
        <!-- Icons based on level -->
        <div class="trust-badge__level-icon" *ngIf="variant !== 'admin'">
            <svg *ngIf="level === 1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c1-4 6-7 6-12a6 6 0 0 0-12 0c0 5 5 8 6 12z" />
            </svg>
            <svg *ngIf="level === 2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
            </svg>
            <svg *ngIf="level === 3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
            </svg>
            <svg *ngIf="level === 4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z" />
            </svg>
            <svg *ngIf="level === 5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 9 7 12 7s5-3 7.5-3a2.5 2.5 0 0 1 0 5H18" />
                <path d="M18 15h1.5a2.5 2.5 0 0 0 0-5H18" />
                <path d="M6 15H4.5a2.5 2.5 0 0 1 0-5H6" />
                <rect x="6" y="9" width="12" height="6" rx="1" />
                <path d="M10 15v4a2 2 0 0 0 4 0v-4" />
            </svg>
        </div>
        <span class="trust-badge__level-text">{{ levelLabel }}</span>
    </div>
</div>
