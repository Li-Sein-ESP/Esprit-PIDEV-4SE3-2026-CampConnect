name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "Wilderness_Academy&Events" ]
  pull_request:
    branches: [ "main", "Wilderness_Academy&Events" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        run: |
          cd connectcamp/backend
          mvn clean test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: connectcamp/angular-campconnect/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: connectcamp/angular-campconnect
        run: npm ci

      - name: Run Angular Tests (Jasmine/Karma)
        working-directory: connectcamp/angular-campconnect
        run: npm run test -- --watch=false --browsers=ChromeHeadless
