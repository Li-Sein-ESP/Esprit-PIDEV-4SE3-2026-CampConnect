<div class="min-h-screen bg-[var(--color-background)] py-12">
  <div class="container max-w-3xl text-center">
    <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <lucide-icon [img]="CheckCircle" class="w-12 h-12 text-green-600"></lucide-icon>
    </div>

    <h2 class="mb-4">Booking Confirmed!</h2>
    <p class="text-[var(--color-text-secondary)] mb-2">Your reservation has been successfully confirmed</p>
    <p class="text-sm text-[var(--color-text-tertiary)] mb-8">Booking ID: {{ bookingId }}</p>

    <app-card variant="elevated" class="mb-8 text-left">
      <app-card-content class="p-8">
        <div class="flex gap-4 mb-6">
          <img src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=800&q=80" alt="Campsite"
            class="w-32 h-32 object-cover rounded-lg" />
          <div class="flex-1">
            <h4 class="mb-2">Upper Pines Campground</h4>
            <div class="flex items-center gap-2 text-sm text-[var(--color-text-secondary)] mb-2">
              <lucide-icon [img]="MapPin" class="w-4 h-4"></lucide-icon>
              <span>Yosemite National Park, CA</span>
            </div>
            <app-badge variant="success">Confirmed</app-badge>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-6 border-t">
          <div>
            <div class="text-sm text-[var(--color-text-tertiary)] mb-1">Check-in</div>
            <div class="flex items-center gap-2">
              <lucide-icon [img]="Calendar" class="w-4 h-4 text-[var(--color-primary-600)]"></lucide-icon>
              <span class="font-medium">July 15, 2024</span>
            </div>
            <div class="text-xs text-[var(--color-text-tertiary)] mt-1">After 2:00 PM</div>
          </div>
          <div>
            <div class="text-sm text-[var(--color-text-tertiary)] mb-1">Check-out</div>
            <div class="flex items-center gap-2">
              <lucide-icon [img]="Calendar" class="w-4 h-4 text-[var(--color-primary-600)]"></lucide-icon>
              <span class="font-medium">July 18, 2024</span>
            </div>
            <div class="text-xs text-[var(--color-text-tertiary)] mt-1">Before 11:00 AM</div>
          </div>
        </div>
      </app-card-content>
    </app-card>

    <div class="flex gap-4 justify-center mb-8">
      <app-button variant="outline">
        <lucide-icon [img]="Download" class="w-5 h-5 mr-2"></lucide-icon>
        Download Confirmation
      </app-button>
      <app-button variant="outline">
        <lucide-icon [img]="Mail" class="w-5 h-5 mr-2"></lucide-icon>
        Email Confirmation
      </app-button>
    </div>

    <app-button routerLink="/dashboard">View My Bookings</app-button>
  </div>
</div>
