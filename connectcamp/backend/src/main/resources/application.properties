spring.application.name=campconnect-backend
server.port=8082

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/CampconnectDB

# JWT Configuration (Change this in production)
app.jwtSecret=CampConnectSecretKeyForJwtTokenGenerationWhichShouldBeLongEnoughToMeetRequirements
app.jwtExpirationMs=86400000

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# File Upload Directory
app.upload.dir=uploads

# CampGuard CSV + KPI + scheduler configuration
campguard.files.predictions-path=${CAMPGUARD_PREDICTIONS_PATH:connectcamp/backend/campguard_predictions.csv}
campguard.files.queue-path=${CAMPGUARD_QUEUE_PATH:connectcamp/backend/campaign_queue_antispam.csv}
campguard.files.history-path=${CAMPGUARD_HISTORY_PATH:connectcamp/backend/campaign_history.csv}
campguard.logic.antispam-days=${CAMPGUARD_ANTISPAM_DAYS:7}
campguard.kpi.recall=${CAMPGUARD_KPI_RECALL:0.8182}
campguard.kpi.precision=${CAMPGUARD_KPI_PRECISION:0.3498}
campguard.kpi.reengagement-rate=${CAMPGUARD_KPI_REENGAGEMENT_RATE:0.0}
campguard.kpi.churn-before=${CAMPGUARD_KPI_CHURN_BEFORE:0.2037}
campguard.kpi.churn-after=${CAMPGUARD_KPI_CHURN_AFTER:0.0}
campguard.scheduler.enabled=${CAMPGUARD_SCHEDULER_ENABLED:false}
campguard.scheduler.cron=${CAMPGUARD_SCHEDULER_CRON:0 0 2 * * ?}
