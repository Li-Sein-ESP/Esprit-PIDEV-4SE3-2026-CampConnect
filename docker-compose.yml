services:
  mongodb:
    image: mongo:7
    container_name: campconnect-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - campconnect-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campconnect-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/CampconnectDB
      - APP_JWTSECRET=CampConnectSecretKeyForJwtTokenGenerationWhichShouldBeLongEnoughToMeetRequirements
      - APP_JWTEXPIRATIONMS=86400000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - campconnect-network
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: ./angular-campconnect
      dockerfile: Dockerfile
    container_name: campconnect-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campconnect-network

networks:
  campconnect-network:
    driver: bridge

volumes:
  mongo-data:
  uploads-data:
